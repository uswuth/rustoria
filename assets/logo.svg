<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Rust orange gradient -->
    <linearGradient id="rustGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E85D3D;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#CE422B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A33327;stop-opacity:1" />
    </linearGradient>
    
    <!-- Dark gradient for depth -->
    <linearGradient id="darkGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2D2D2D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A1A1A;stop-opacity:1" />
    </linearGradient>
    
    <!-- Accent gradient for circuit lines -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#CE422B;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#E85D3D;stop-opacity:0.4" />
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background circle with subtle gradient -->
  <circle cx="256" cy="256" r="240" fill="url(#darkGradient)" opacity="0.15"/>
  
  <!-- Outer gear ring (engineering) -->
  <g transform="translate(256, 256)">
    <!-- Gear teeth -->
    <g fill="url(#rustGradient)" opacity="0.9">
      <!-- 12 gear teeth -->
      <rect x="-8" y="-230" width="16" height="40" rx="2"/>
      <rect x="-8" y="-230" width="16" height="40" rx="2" transform="rotate(30)"/>
      <rect x="-8" y="-230" width="16" height="40" rx="2" transform="rotate(60)"/>
      <rect x="-8" y="-230" width="16" height="40" rx="2" transform="rotate(90)"/>
      <rect x="-8" y="-230" width="16" height="40" rx="2" transform="rotate(120)"/>
      <rect x="-8" y="-230" width="16" height="40" rx="2" transform="rotate(150)"/>
      <rect x="-8" y="-230" width="16" height="40" rx="2" transform="rotate(180)"/>
      <rect x="-8" y="-230" width="16" height="40" rx="2" transform="rotate(210)"/>
      <rect x="-8" y="-230" width="16" height="40" rx="2" transform="rotate(240)"/>
      <rect x="-8" y="-230" width="16" height="40" rx="2" transform="rotate(270)"/>
      <rect x="-8" y="-230" width="16" height="40" rx="2" transform="rotate(300)"/>
      <rect x="-8" y="-230" width="16" height="40" rx="2" transform="rotate(330)"/>
    </g>
    
    <!-- Gear body ring -->
    <circle cx="0" cy="0" r="195" fill="none" stroke="url(#rustGradient)" stroke-width="12" opacity="0.6"/>
    <circle cx="0" cy="0" r="185" fill="none" stroke="url(#rustGradient)" stroke-width="2" opacity="0.3"/>
  </g>
  
  <!-- Central modular hexagon structure -->
  <g transform="translate(256, 256)">
    <!-- Main hexagon -->
    <polygon 
      points="0,-140 121.2,-70 121.2,70 0,140 -121.2,70 -121.2,-70" 
      fill="url(#rustGradient)" 
      stroke="#E85D3D" 
      stroke-width="2"
      filter="url(#glow)"/>
    
    <!-- Inner hexagon cutout -->
    <polygon 
      points="0,-100 86.6,-50 86.6,50 0,100 -86.6,50 -86.6,-50" 
      fill="#1A1A1A" 
      opacity="0.9"/>
    
    <!-- Inner hexagon border -->
    <polygon 
      points="0,-100 86.6,-50 86.6,50 0,100 -86.6,50 -86.6,-50" 
      fill="none" 
      stroke="url(#accentGradient)" 
      stroke-width="3"/>
    
    <!-- Central AI node -->
    <circle cx="0" cy="0" r="35" fill="url(#rustGradient)"/>
    <circle cx="0" cy="0" r="25" fill="#1A1A1A"/>
    <circle cx="0" cy="0" r="15" fill="url(#rustGradient)"/>
    
    <!-- Circuit connections from center to hexagon vertices -->
    <g stroke="url(#accentGradient)" stroke-width="2" opacity="0.7">
      <line x1="0" y1="0" x2="0" y2="-100"/>
      <line x1="0" y1="0" x2="86.6" y2="-50"/>
      <line x1="0" y1="0" x2="86.6" y2="50"/>
      <line x1="0" y1="0" x2="0" y2="100"/>
      <line x1="0" y1="0" x2="-86.6" y2="50"/>
      <line x1="0" y1="0" x2="-86.6" y2="-50"/>
    </g>
    
    <!-- Connection nodes at hexagon vertices -->
    <g fill="url(#rustGradient)">
      <circle cx="0" cy="-100" r="8"/>
      <circle cx="86.6" cy="-50" r="8"/>
      <circle cx="86.6" cy="50" r="8"/>
      <circle cx="0" cy="100" r="8"/>
      <circle cx="-86.6" cy="50" r="8"/>
      <circle cx="-86.6" cy="-50" r="8"/>
    </g>
    
    <!-- Small circuit traces extending outward -->
    <g stroke="url(#accentGradient)" stroke-width="1.5" opacity="0.5">
      <!-- Top -->
      <path d="M 0,-140 L 0,-170 L 20,-170 L 20,-185" fill="none"/>
      <circle cx="20" cy="-185" r="3" fill="url(#rustGradient)"/>
      
      <!-- Top-right -->
      <path d="M 121.2,-70 L 145,-85 L 160,-85 L 160,-100" fill="none"/>
      <circle cx="160" cy="-100" r="3" fill="url(#rustGradient)"/>
      
      <!-- Bottom-right -->
      <path d="M 121.2,70 L 145,85 L 160,85 L 160,100" fill="none"/>
      <circle cx="160" cy="100" r="3" fill="url(#rustGradient)"/>
      
      <!-- Bottom -->
      <path d="M 0,140 L 0,170 L -20,170 L -20,185" fill="none"/>
      <circle cx="-20" cy="185" r="3" fill="url(#rustGradient)"/>
      
      <!-- Bottom-left -->
      <path d="M -121.2,70 L -145,85 L -160,85 L -160,100" fill="none"/>
      <circle cx="-160" cy="100" r="3" fill="url(#rustGradient)"/>
      
      <!-- Top-left -->
      <path d="M -121.2,-70 L -145,-85 L -160,-85 L -160,-100" fill="none"/>
      <circle cx="-160" cy="-100" r="3" fill="url(#rustGradient)"/>
    </g>
  </g>
  
  <!-- Floating modular blocks (representing modularity) -->
  <g opacity="0.8">
    <!-- Top-left block -->
    <rect x="80" y="80" width="40" height="40" rx="6" fill="url(#rustGradient)" transform="rotate(-15, 100, 100)"/>
    
    <!-- Top-right block -->
    <rect x="392" y="80" width="40" height="40" rx="6" fill="url(#rustGradient)" transform="rotate(15, 412, 100)"/>
    
    <!-- Bottom-left block -->
    <rect x="80" y="392" width="40" height="40" rx="6" fill="url(#rustGradient)" transform="rotate(15, 100, 412)"/>
    
    <!-- Bottom-right block -->
    <rect x="392" y="392" width="40" height="40" rx="6" fill="url(#rustGradient)" transform="rotate(-15, 412, 412)"/>
  </g>
  
  <!-- Connection lines between floating blocks and center -->
  <g stroke="url(#accentGradient)" stroke-width="1" opacity="0.3" stroke-dasharray="4,4">
    <line x1="100" y1="100" x2="180" y2="180"/>
    <line x1="412" y1="100" x2="332" y2="180"/>
    <line x1="100" y1="412" x2="180" y2="332"/>
    <line x1="412" y1="412" x2="332" y2="332"/>
  </g>
  
  <!-- Subtle grid pattern background -->
  <g opacity="0.05" stroke="#CE422B" stroke-width="0.5">
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="0" x2="512" y2="512"/>
    <line x1="512" y1="0" x2="0" y2="512"/>
  </g>
</svg>
