name: links

on:
  push:
    branches: [main, master]
  schedule:
    - cron: "0 6 * * 1"

# Least privilege: this workflow only reads repository content.
permissions:
  contents: read

jobs:
  link-check:
    name: Check links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >
            --exclude-all-private
            --exclude-mail
            --exclude-path "examples/*/target/**"
            .
          fail: true
