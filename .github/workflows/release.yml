name: release

on:
  push:
    tags:
      - "v*"

# Least privilege by default; the release job elevates to contents: write
# because creating a GitHub Release requires it. No other token scopes.
permissions:
  contents: read

jobs:
  rust:
    name: Rust examples (release gate)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        example:
          - std-file-processor
          - minimal-api
          - modular-monolith
          - async-service
          - cli
          - library
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy, rustfmt
      - name: Check
        run: cargo check --manifest-path examples/${{ matrix.example }}/Cargo.toml
      - name: Test
        run: cargo test --manifest-path examples/${{ matrix.example }}/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path examples/${{ matrix.example }}/Cargo.toml --all-targets -- -D warnings
      - name: Format
        run: cargo fmt --manifest-path examples/${{ matrix.example }}/Cargo.toml -- --check

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: rust
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate repository
        run: bash scripts/validate.sh

      - name: Run trigger tests
        run: bash scripts/test-triggers.sh

      # Tag names are attacker-influenced ref data: validate the shape here, then
      # pass the value to later steps via env (never re-interpolate untrusted
      # values directly into run: scripts with ${{ }}).
      - name: Get version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "Tag-derived version '$VERSION' is not a semver-like string; refusing to continue." >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          {
            echo "## Rustoria v${VERSION}"
            echo ""
            echo "### Skills"
            echo "- $(find skills -name SKILL.md | wc -l) skills"
            echo ""
            echo "### References"
            echo "- $(find references -name '*.md' | wc -l) references"
            echo ""
            echo "### Examples"
            echo "- $(find examples -name Cargo.toml | wc -l) examples"
          } > RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
