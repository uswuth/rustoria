name: Documentation
description: Report documentation issues or propose documentation improvements
title: "[Docs] "
labels: ["type:documentation", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the documentation feedback.

  - type: input
    id: location
    attributes:
      label: Location
      description: Which file or section?
      placeholder: "e.g. README.md, docs/architecture.md"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is the issue?
      description: Describe the documentation problem or proposed improvement.
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
      description: If you have a specific suggestion, describe it here.
    validations:
      required: false
